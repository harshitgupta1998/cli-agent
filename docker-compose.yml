services:
  frontend:
    build:
      context: ./frontend
    container_name: termind-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    container_name: termind-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://termind:termind@database:5432/termind?sslmode=disable}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_ONLY_MODE: ${LOCAL_ONLY_MODE:-true}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app

  database:
    image: postgres:16-alpine
    container_name: termind-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-termind}
      POSTGRES_USER: ${POSTGRES_USER:-termind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-termind}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termind -d termind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  postgres-data:
